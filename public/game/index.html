<style>
/* VOICE: calm, respectful, tactical — a training exam, not a war game
   IDEA: a handler's field card — graphite ground, gold markings, the field blooms when cleared
   PICTURE: the 7×7 field itself with a Malinois token that sniffs, perks its ears and sits
   COLOUR and TYPE: graphite #141619, gold #c9a24a, amber scent glow, green only for growth; Manrope
   LAYOUT: header + lang, stats, the field, mode controls; sheets for intro / stop / rest / win */
:root{color-scheme:dark;--bg:#131518;--panel:#1b1e22;--cell:#1f2328;--line:#2d3238;--ink:#ece7dc;--mute:#9b978e;--gold:#c9a24a;--gold2:#ecd08a;--amber:#e09a45;--leaf:#4f7a4a;--leaf2:#8db46f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#23272d 0,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
.app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;overflow:hidden}.brand>div{overflow:hidden}.brand svg{flex:none}
.brand svg{width:34px;height:34px}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:13px;line-height:1.2}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none}
.snd{all:unset;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#0f1113;border:1px solid var(--line);color:var(--gold2)}
.snd svg{width:20px;height:20px}.snd[aria-pressed=true]{color:var(--mute)}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.langs{display:flex;gap:2px;background:#0f1113;border:1px solid var(--line);border-radius:10px;padding:3px}
.langs button{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--mute);padding:6px 6px;border-radius:7px;min-width:20px;text-align:center}
.langs button[aria-pressed=true]{background:#2a2e34;color:var(--gold2)}
.langs button:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.st span{display:block;font-size:13px;color:var(--mute);line-height:1.2}
.st b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;background:#2a2e34;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .25s}
.bar.low i{background:var(--amber)}
.status{min-height:44px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#171a1e;border:1px solid var(--line);font-size:15px;font-weight:600}
.status .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.status[data-l="1"] .dot{background:#8a6a3a}.status[data-l="2"] .dot{background:var(--amber)}.status[data-l="3"] .dot{background:var(--gold2);box-shadow:0 0 10px var(--amber)}
.status[data-l=sit] .dot{background:var(--gold)}
.status.warn{border-color:#6b5426;color:var(--gold2)}
.field{background:#0e1012;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 20px 50px -20px #000}
.grid{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));aspect-ratio:1;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.c{position:relative;overflow:hidden;margin:2px;border-radius:8px;border:1px solid #252a30;background:repeating-linear-gradient(135deg,#1b1f24 0 6px,#1e2227 6px 12px);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:clamp(15px,4.4vw,20px);color:var(--gold2);transition:background .3s,border-color .2s}
.c.rv{background:#262a30;border-color:#30353c}
.c.s1{background:radial-gradient(circle,rgba(224,154,69,.13),transparent 72%),#262a30}
.c.s2{background:radial-gradient(circle,rgba(224,154,69,.27),transparent 75%),#282a2c;border-color:#5a4529}
.c.s3{background:radial-gradient(circle,rgba(236,180,90,.48),rgba(224,154,69,.12) 80%),#2c2a26;border-color:#8a6630}
.c.nx{border-color:#5d5034}
.flagmode .c.nx:not(.rv){border:1px dashed var(--gold)}
.c .pw{position:absolute;right:3px;bottom:3px;width:32%;height:32%;opacity:.35;fill:var(--mute)}
.c .fl{position:absolute;inset:19%;width:62%;height:62%}
.c.hz{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(236,208,138,.35)}
.c.hz::after{content:"";width:34%;height:34%;border:2px solid var(--gold2);transform:rotate(45deg);border-radius:3px}
.c.bl{background:#1e2b1f;border-color:#2f4630;transition:background .5s var(--d),border-color .5s var(--d)}
.c .pl{position:absolute;inset:13%;width:74%;height:74%;opacity:0;transform:scale(.3) translateY(20%);animation:grow .55s cubic-bezier(.2,.9,.3,1.3) var(--d) forwards}
@keyframes grow{to{opacity:1;transform:none}}
.dog{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);display:grid;place-items:center;pointer-events:none;transition:transform .22s ease;z-index:2}
.dog svg{width:80%;height:80%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));transition:transform .25s}
.dog::before{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid transparent}
.dog.sniff svg{animation:bob .7s ease-in-out infinite}
.dog.ears .ear{animation:perk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.dog.alert::before{border-color:var(--amber);animation:ping 1s ease-out infinite}
.dog.alert .ear{transform:scaleY(1.12);transform-box:fill-box;transform-origin:50% 100%}
.dog.sit svg{transform:translateY(10%) scale(.86)}
.dog.sit::before{border-color:var(--gold);inset:4%}
.dog.won{opacity:0;transition:opacity .4s .3s}
@keyframes bob{50%{transform:translateY(7%)}}
@keyframes perk{to{transform:scaleY(1.14) rotate(var(--r,0deg))}}
@keyframes ping{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}
.ctrl{display:grid;grid-template-columns:1fr 52px;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0f1113;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:10px;font-weight:700;font-size:15px;color:var(--mute)}
.seg button svg{width:18px;height:18px;fill:currentColor}
.seg button[aria-pressed=true]{background:#2a2e34;color:var(--gold2)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;text-align:center}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1609}
.btn.sec{background:#262a30;color:var(--ink);border:1px solid var(--line)}
.btn.icon{padding:0;width:52px;background:#0f1113;border:1px solid var(--line);color:var(--mute)}
.btn.icon svg{width:22px;height:22px}
.hint{font-size:13px;color:var(--mute);text-align:center;margin:0}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,9,11,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex}
.sheet{width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;animation:up .3s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.sheet h2{margin:0;font-size:30px;line-height:1.05;font-weight:800;text-wrap:balance}
.sheet p{margin:0}
.lead{color:#cfc9bc}
.hero{display:grid;place-items:center;padding:10px 0 4px}
.hero svg{width:116px;height:116px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15px;color:#d6d0c4}
.rules svg{width:26px;height:26px;fill:var(--gold)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.figs>div{background:#15181b;border:1px solid var(--line);border-radius:12px;padding:10px}
.figs span{display:block;font-size:13px;color:var(--mute)}
.figs b{font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:3px;margin-top:3px}.stars svg{width:18px;height:18px}
.card{background:#15181b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.card b{display:block;color:var(--gold2);font-size:13px;margin-bottom:2px}
.card.safe{border-color:#3d5a39;background:#172018}.card.safe b{color:var(--leaf2)}
.cta{display:grid;gap:10px;padding-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--gold2);color:#1a1609;font-weight:700;padding:10px 18px;border-radius:999px;z-index:20;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:13px;color:var(--mute);text-align:center;margin-top:auto}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.c .pl{opacity:1;transform:none}}
@media (max-width:360px){.st{padding:7px 8px}.brand small{display:none}}
</style>

<script>
{
class SoundEngine {
  constructor(storageKey = "gmah_sound_muted") {
    this.storageKey = storageKey;
    this.ctx = null;
    this.muted = this._loadMuted();
  }

  _loadMuted() {
    try {
      return localStorage.getItem(this.storageKey) === "true";
    } catch {
      return false;
    }
  }

  _saveMuted() {
    try {
      localStorage.setItem(this.storageKey, String(this.muted));
    } catch {
      // Игнорируем ошибки доступа к storage в приватном режиме
    }
  }

  unlock() {
    if (typeof window === "undefined") return null;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;

    if (!this.ctx) {
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  setMuted(value) {
    this.muted = Boolean(value);
    this._saveMuted();
  }

  toggleMute() {
    this.setMuted(!this.muted);
    return this.muted;
  }

  isMuted() {
    return this.muted;
  }

  // 1. Мягкий звук шага (приглушённый импульс + лёгкий отклик по уровню запаха 0..3)
  playStep(smellLevel = 0) {
    if (this.muted) return;
    const ctx = this.unlock();
    if (!ctx) return;

    const now = ctx.currentTime;
    const baseFreq = 110 + Math.max(0, Math.min(3, smellLevel)) * 22;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.065);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + 0.075);
  }

  // 2. Звук установки флага (чёткий, доброжелательный двухнотный сигнал)
  playFlag() {
    if (this.muted) return;
    const ctx = this.unlock();
    if (!ctx) return;

    const now = ctx.currentTime;
    const notes = [523.25, 659.25]; // C5 -> E5

    notes.forEach((freq, idx) => {
      const start = now + idx * 0.07;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.14, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.14);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(start);
      osc.stop(start + 0.15);
    });
  }

  // 3. Фанфары победы (тёплая восходящая мелодия в мажоре при полном разминировании)
  playFanfare() {
    if (this.muted) return;
    const ctx = this.unlock();
    if (!ctx) return;

    const now = ctx.currentTime;
    // C5 - E5 - G5 - C6
    const melody = [
      { freq: 523.25, offset: 0.0, duration: 0.14 },
      { freq: 659.25, offset: 0.12, duration: 0.14 },
      { freq: 783.99, offset: 0.24, duration: 0.16 },
      { freq: 1046.5, offset: 0.38, duration: 0.42 },
    ];

    melody.forEach(({ freq, offset, duration }) => {
      const start = now + offset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, start);

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(start);
      osc.stop(start + duration + 0.02);
    });
  }

  // 4. Спокойный сигнал остановки работы кинологом (спокойный короткий тон)
  playHandlerStop() {
    if (this.muted) return;
    const ctx = this.unlock();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.linearRampToValueAtTime(170, now + 0.22);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + 0.25);
  }
}

    <div class="figs">
      <div><span>${t("area")}</span><b>${(W*H*CELL_M2).toLocaleString(lang==="en"?"en-US":lang)} m²</b></div>
      <div><span>${t("time")}</span><b>${fmt(secs())}</b></div>
      <div><span>${t("stars")}</span><div class="stars" aria-label="${n}/3">${starSvg(n)}</div></div>
    </div>
    <div class="card"><b>${t("factT")}</b>${t("fact")}</div>
    <div class="card safe"><b>${t("safeT")}</b>${t("safe")}</div>
    <div class="cta"><p>${t("ctaT")}</p>
      <a class="btn pri" href="https://sydanukrainalle.org" target="_blank" rel="noopener">${t("donate")}</a>
      <div class="row2"><button class="btn sec" data-a="share">${t("share")}</button><button class="btn sec" data-a="restart">${t("replay")}</button></div>
    </div>`;
  }
  sh.innerHTML=h;$("ov").classList.add("on");
  const f=sh.querySelector("button,a");if(f)f.focus({preventScroll:true});
}
function hide(){cur=null;$("ov").classList.remove("on")}

$("sheet").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="close")hide();else if(a==="restart"){hide();reset();render()}else if(a==="share")doShare()});

/* tap = action by mode; long-press = flag */
let lpT=null,lpDone=false,downI=-1;
grid.addEventListener("pointerdown",e=>{const c=e.target.closest(".c");if(!c||S.over)return;downI=+c.dataset.i;lpDone=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpDone=true;toggleFlag(downI)},450)});
grid.addEventListener("pointerup",e=>{clearTimeout(lpT);if(lpDone||downI<0||S.over){downI=-1;return}const i=downI;downI=-1;S.mode==="flag"?toggleFlag(i):step(i)});
grid.addEventListener("pointercancel",()=>{clearTimeout(lpT);downI=-1});
grid.addEventListener("contextmenu",e=>e.preventDefault());

$("mStep").onclick=()=>{S.mode="step";render()};
$("mFlag").onclick=()=>{S.mode="flag";render()};
$("restart").onclick=()=>{hide();reset();render()};

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{if(!el.classList.contains("c"))el.textContent=t(el.dataset.i)});
  $("langs").innerHTML=LANGS.map(l=>`<button data-l="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");
  document.title=t("title")+" · GMAH";
  render();sndUI();if(cur)show(cur);
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("gmah-lang",lang)}catch(x){}applyLang()});

document.addEventListener("pointerdown",()=>{if(!soundEngine.isMuted())soundEngine.unlock()},{passive:true});
function sndUI(){const m=soundEngine.isMuted();$("snd").setAttribute("aria-pressed",m);$("snd").setAttribute("aria-label",t(m?"sndOff":"sndOn"));$("sndUse").setAttribute("href",m?"#sndOff":"#sndOn")}
$("snd").onclick=()=>{soundEngine.toggleMute();if(!soundEngine.isMuted()){soundEngine.unlock();soundEngine.playFlag()}sndUI()};
setInterval(()=>{if(S.t0&&!S.over)$("vTime").textContent=fmt(secs())},500);

reset();applyLang();show("intro");
}
</script>
</body>
</html>
